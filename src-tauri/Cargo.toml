[package]
name = "chatvault"
version = "0.5.0"
description = "Browse and read every Claude Code chat stored on this PC"
authors = ["Sanaullah Rais"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chatvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
zstd = "0.14.3"
tauri-plugin-dialog = "2.8.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = 0
# Reading chats parses very large files, so the libraries are optimized even in development builds; ChatVault's own code stays quick to rebuild.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 0
