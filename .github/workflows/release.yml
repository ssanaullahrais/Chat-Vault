name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ChatVault ${{ github.ref_name }}"
          releaseBody: |
            ## ChatVault ${{ github.ref_name }}

            Read, search, back up and continue your Claude Code, Codex, Cursor, Gemini CLI, OpenCode and Cline chats.

            **Download**
            - `ChatVault_*_x64-setup.exe`: the installer (recommended)
            - `ChatVault_*_x64_en-US.msi`: Windows Installer package
            - `ChatVault_*_x64-portable.exe`: runs without installing

            Installed copies of ChatVault update themselves from this release.
          releaseDraft: false
          prerelease: false

      - name: Attach the portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "ChatVault_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/chatvault.exe $name
          gh release upload "${{ github.ref_name }}" $name --clobber --repo "${{ github.repository }}"
