name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify the release version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match application version $version."
          }

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and sign Windows installers
        run: npm run tauri -- build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional desktop OAuth client for Google Drive backups.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Publish the complete Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $version = $tag.Substring(1)
          $msi = "ChatVault_${version}_x64_en-US.msi"
          $setup = "ChatVault_${version}_x64-setup.exe"
          $portable = "ChatVault_${version}_x64-portable.exe"
          $release = 'src-tauri/target/release'
          $msiPath = "$release/bundle/msi/$msi"
          $setupPath = "$release/bundle/nsis/$setup"
          Copy-Item "$release/chatvault.exe" $portable

          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No CHANGELOG.md section for $version." }
          $notes = @(
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ') { break }
              $lines[$i]
            }
          )
          $body = @(
            "## ChatVault $tag", "",
            ($notes -join "`n").Trim(), "",
            "### Windows downloads", "",
            "- ``$setup`` — installer (recommended)",
            "- ``$msi`` — Windows Installer package",
            "- ``$portable`` — runs without installing", "",
            "Installed copies can update automatically."
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'chatvault-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $body -Encoding utf8

          $downloadUrl = "$env:GITHUB_SERVER_URL/$repo/releases/download/$tag"
          $msiUpdate = @{ url = "$downloadUrl/$msi"; signature = (Get-Content -LiteralPath "$msiPath.sig" -Raw).Trim() }
          $nsisUpdate = @{ url = "$downloadUrl/$setup"; signature = (Get-Content -LiteralPath "$setupPath.sig" -Raw).Trim() }
          $manifest = @{
            version = $version
            notes = $body
            pub_date = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            platforms = @{ 'windows-x86_64' = $msiUpdate; 'windows-x86_64-msi' = $msiUpdate; 'windows-x86_64-nsis' = $nsisUpdate }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath latest.json -Encoding utf8
          $assets = @($msiPath, "$msiPath.sig", $setupPath, "$setupPath.sig", $portable, 'latest.json')
          foreach ($asset in $assets) {
            if ((Get-Item -LiteralPath $asset).Length -eq 0) { throw "Empty release asset $asset." }
          }
          if (-not $msiUpdate.signature -or -not $nsisUpdate.signature) { throw 'An updater signature is empty.' }

          $existing = gh api --paginate "repos/$repo/releases?per_page=100" --jq ".[] | select(.tag_name == `"$tag`") | .draft"
          if ($existing -eq 'false') { throw "Release $tag is already published." }
          if ($existing -ne 'true') {
            gh release create $tag --repo $repo --verify-tag --draft --title "ChatVault $tag" --notes-file $notesPath
          }
          foreach ($asset in $assets) {
            gh release upload $tag $asset --repo $repo --clobber
          }
          $uploaded = gh release view $tag --repo $repo --json assets --jq '.assets[] | select(.state == "uploaded") | .name'
          foreach ($asset in $assets) {
            $name = Split-Path -Path $asset -Leaf
            if ($name -cnotin $uploaded) { throw "Release $tag is missing $name." }
          }
          gh release edit $tag --repo $repo --notes-file $notesPath --draft=false --latest
